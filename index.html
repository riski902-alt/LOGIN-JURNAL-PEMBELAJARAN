<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - INFORMATIKA FUN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === VARIABEL WARNA & TEMA === */
        :root {
            --title-navy: #173B57;
            --soft-denim: #6F91AA;
            --light-denim: #AFC9D8;
            --soft-navy: #314F68;
            --soft-white: #F7FBFF;
            --soft-green: #B7D8C8;
            --button-color: #527F9B;
            --button-hover: #477FA0;
            --error-color: #e63946;
            --success-color: #2a9d8f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--soft-white) 0%, var(--light-denim) 50%, var(--soft-green) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* === ELEMEN MELAYANG (FLOATING BACKGROUND) === */
        .floating-elements {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .float-icon {
            position: absolute;
            opacity: 0.08;
            fill: var(--soft-navy);
            animation: float 6s ease-in-out infinite;
        }

        .fi-1 { top: 15%; left: 10%; width: 60px; animation-duration: 7s; animation-delay: 0s; }
        .fi-2 { top: 70%; left: 15%; width: 80px; animation-duration: 8s; animation-delay: 1s; }
        .fi-3 { top: 20%; right: 15%; width: 70px; animation-duration: 6s; animation-delay: 2s; }
        .fi-4 { top: 75%; right: 10%; width: 90px; animation-duration: 9s; animation-delay: 0.5s; }
        .fi-5 { top: 45%; left: 5%; width: 50px; animation-duration: 7.5s; animation-delay: 1.5s; }
        .fi-6 { top: 50%; right: 5%; width: 65px; animation-duration: 8.5s; animation-delay: 2.5s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .float-icon {
                animation: none;
                opacity: 0.04;
            }
        }

        /* === KOTAK LOGIN (GLASSMORPHISM) === */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 26px;
            padding: 40px;
            box-shadow: 0 12px 35px rgba(37, 83, 112, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        /* === HEADER LOGIN === */
        .header-icon {
            width: 50px;
            height: 50px;
            background: var(--soft-white);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 4px 12px rgba(111, 145, 170, 0.2);
            border: 1px solid var(--light-denim);
            color: var(--button-color);
        }

        .login-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--title-navy);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .login-desc {
            font-size: 13px;
            color: var(--soft-navy);
            margin-bottom: 28px;
            opacity: 0.8;
            margin-top: 8px;
        }

        /* === FORM INPUT === */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--title-navy);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 16px;
            color: var(--soft-denim);
            width: 18px;
            height: 18px;
        }

        .input-field {
            width: 100%;
            min-height: 50px;
            background: #ffffff;
            border: 1.5px solid #E2E8F0;
            border-radius: 14px;
            padding: 12px 16px 12px 44px;
            font-size: 14px;
            color: var(--title-navy);
            transition: all 0.25s ease;
            outline: none;
        }

        .input-field::placeholder {
            color: #94A3B8;
        }

        .input-field:focus {
            border-color: var(--soft-denim);
            box-shadow: 0 0 0 4px rgba(111, 145, 170, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: var(--soft-denim);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: color 0.2s;
        }
        
        .toggle-password:focus {
            outline: 2px solid var(--soft-denim);
            outline-offset: 2px;
        }

        .toggle-password:hover {
            color: var(--title-navy);
        }

        /* === TOMBOL LOGIN === */
        .btn-login {
            width: 100%;
            min-height: 52px;
            background: var(--button-color);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(82, 127, 155, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--button-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(82, 127, 155, 0.4);
        }

        .btn-login:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn-login:focus {
            outline: 3px solid rgba(82, 127, 155, 0.4);
            outline-offset: 2px;
        }

        /* === STATUS MESSAGE === */
        .status-message {
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            padding: 10px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-error {
            background: #FEE2E2;
            color: var(--error-color);
            border: 1px solid #FECACA;
        }

        .status-success {
            background: #D1FAE5;
            color: var(--success-color);
            border: 1px solid #A7F3D0;
        }

        /* === FOOTER CARD === */
        .card-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(226, 232, 240, 0.8);
        }

        .footer-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--soft-navy);
            letter-spacing: 0.5px;
        }

        .footer-desc {
            font-size: 11px;
            color: var(--soft-denim);
            margin-top: 2px;
        }

        /* === RESPONSIVE STYLES === */
        @media (max-width: 768px) {
            .login-wrapper { max-width: 90%; }
        }
        
        @media (max-width: 480px) {
            .login-wrapper { max-width: 92%; }
            .login-card { padding: 32px 24px; border-radius: 22px; }
            .login-title { font-size: 24px; }
            .btn-login { min-height: 48px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND ELEMEN MELAYANG (SVGs) -->
    <div class="floating-elements" aria-hidden="true">
        <!-- Laptop -->
        <svg class="float-icon fi-1" viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
        <!-- Code / Brackets -->
        <svg class="float-icon fi-2" viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
        <!-- Cloud -->
        <svg class="float-icon fi-3" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        <!-- Mouse -->
        <svg class="float-icon fi-4" viewBox="0 0 24 24"><path d="M13 1.07V9h7c0-4.08-3.05-7.44-7-7.93zM4 15c0 4.42 3.58 8 8 8s8-3.58 8-8v-4H4v4zm7-13.93C7.05 1.56 4 4.92 4 9h7V1.07z"/></svg>
        <!-- Wi-Fi -->
        <svg class="float-icon fi-5" viewBox="0 0 24 24"><path d="M1 9l2 2c5-5 13-5 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <!-- Database -->
        <svg class="float-icon fi-6" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 4.02 2 6.5s4.48 4.5 10 4.5 10-2.02 10-4.5S17.52 2 12 2zm0 10c-5.52 0-10-2.02-10-4.5v3.5C2 13.48 6.48 15.5 12 15.5s10-2.02 10-4.5V11c0 2.48-4.48 4.5-10 4.5zm0 5c-5.52 0-10-2.02-10-4.5v3.5C2 18.48 6.48 20.5 12 20.5s10-2.02 10-4.5v-3.5c0 2.48-4.48 4.5-10 4.5z"/></svg>
    </div>

    <!-- MAIN LOGIN CONTAINER -->
    <main class="login-wrapper">
        <div class="login-card">
            
            <!-- Icon Top (Laptop + Lock) -->
            <div class="header-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>
                    <path d="M12 14c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z" fill="#E2E8F0"/>
                </svg>
            </div>

            <!-- Titles -->
            <h1 class="login-title">LOGIN</h1>
            <p class="login-desc">Silakan masuk untuk melanjutkan pembelajaran Informatika.</p>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                
                <!-- Email Input -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon-left" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                        <input type="email" id="email" class="input-field" placeholder="Masukkan email" required>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon-left" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input type="password" id="password" class="input-field" placeholder="Masukkan password" required>
                        <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Tampilkan password" onclick="togglePassword()">
                            <!-- Eye Icon (Closed by default) -->
                            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button (ID ditambahkan di sini) -->
                <button type="submit" id="btnLogin" class="btn-login">
                    LOGIN 
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>

                <!-- Status Message Area -->
                <div id="statusMessage" class="status-message"></div>
            </form>

            <!-- Footer Card -->
            <div class="card-footer">
                <p class="footer-title">INFORMATIKA FUN</p>
                <p class="footer-desc">By: Riski Amalia, S.Pd</p>
            </div>
        </div>
    </main>

    <!-- JAVASCRIPT LOGIC & FIREBASE -->
<script type="module">
  // 1. Import Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  // 2. Konfigurasi Firebase Anda
  const firebaseConfig = {
    apiKey: "AIzaSyBxy_aOtOcbDIzCKxxKxzcZgQSi4-YUT6g",
    authDomain: "informatika-fun.firebaseapp.com",
    projectId: "informatika-fun",
    storageBucket: "informatika-fun.firebasestorage.app",
    messagingSenderId: "869889926091",
    appId: "1:869889926091:web:7d4d08db90802b8e26cc4e"
  };

  // 3. Menyalakan Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // --- FUNGSI BANTUAN (TAMPILAN) ---
  function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
  }

  function showStatus(message, type) {
    const statusDiv = document.getElementById('statusMessage');
    if (!statusDiv) return; // Cegah error jika elemen tidak ada
    
    statusDiv.innerText = message;
    statusDiv.style.display = 'block';
    
    if (type === 'error') {
      statusDiv.classList.add('status-error');
      statusDiv.classList.remove('status-success');
    } else {
      statusDiv.classList.add('status-success');
      statusDiv.classList.remove('status-error');
    }
  }

  // Membuat fungsi toggle password bisa diakses tombol HTML
  window.togglePassword = function() {
    const passInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passInput.type === 'password') {
      passInput.type = 'text';
      if(eyeIcon) eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
    } else {
      passInput.type = 'password';
      if(eyeIcon) eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    }
  }

  // --- PROSES LOGIN UTAMA (MENGGUNAKAN FIREBASE) ---
  
  // Pastikan tombol di HTML Anda memiliki id="btnLogin"
  const btnLogin = document.getElementById('btnLogin');
  
  if (btnLogin) {
    btnLogin.addEventListener('click', (event) => {
      event.preventDefault(); 
      
      // Mengambil data dari form HTML (Pastikan input HTML Anda memiliki id="email" dan id="password")
      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value;

      // Cek apakah ada yang kosong
      if (emailInput === '' || passwordInput === '') {
        showStatus('Email atau password belum diisi.', 'error');
        return;
      }

      // Cek format email
      if (!isValidEmail(emailInput)) {
        showStatus('Format email tidak valid.', 'error');
        return;
      }

      // Menampilkan pesan loading saat menghubungi Firebase
      showStatus('Memeriksa data...', 'success');

      // Mengecek kecocokan ke database Firebase
      signInWithEmailAndPassword(auth, emailInput, passwordInput)
        .then((userCredential) => {
          showStatus('Login berhasil! Mengalihkan halaman...', 'success');
          // Jika berhasil, pindahkan ke halaman privat
          window.location.href = "https://riski902-alt.github.io/JURNAL-PEMBELAJARAN/"; 
        })
        .catch((error) => {
          // Jika gagal (salah password/email tidak terdaftar)
          showStatus('Login Gagal! Email atau password salah.', 'error');
        });
    });
  }
</script>
    
</body>
</html>
